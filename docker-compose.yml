services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.20.1"
      MEMORY: "10240M"
      MAX_PLAYERS: "10"
      MOTD: "Добро пожаловать!"
      ICON: "https://i.ibb.co/wFZwVNYf/asfdbbzijtk6eclbhlrn-1.png"
      OVERRIDE_ICON: "true"
      ONLINE_MODE: "false"
      USE_AIKAR_FLAGS: "true"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Moscow"
      DIFFICULTY: "2"
      SERVER_NAME: "Lazyfox Server"
      OPS: |-
        lazyfox80

      MODRINTH_PROJECTS: "fabric-api:0.92.2+1.20.1,odyssey-claims,claimorous,resourceful-lib:2.1.24,cloth-config:11.1.118+fabric"
      MODRINTH_ALLOWED_VERSION_TYPE: "release"
      REMOVE_OLD_MODS: "TRUE"

    volumes:
      - "./data:/data"
