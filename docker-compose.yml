services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.8"                   
      MEMORY: "10240M"
      MAX_PLAYERS: "10"
      MOTD: "Добро пожаловать!"
      ICON: "https://i.ibb.co/wFZwVNYf/asfdbbzijtk6eclbhlrn-1.png"
      OVERRIDE_ICON: "true"
      ONLINE_MODE: "false"
      USE_AIKAR_FLAGS: "true"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Moscow"
      DIFFICULTY: "2"
      SERVER_NAME: "Lazyfox Server"
      OPS: |-
        lazyfox80

      MODRINTH_PROJECTS: "fabric-api,odyssey-claims,claimorous" 
      MODRINTH_ALLOWED_VERSION_TYPE: "release" 
      REMOVE_OLD_MODS: "TRUE"

      # Пример использования списка проектов из файла (раскомментировать при необходимости):
      # MODRINTH_PROJECTS: "@/extras/modrinth-mods.txt"

      # Отладка выбора версий (включать при проблемах):
      DEBUG: "true"

    volumes:
      - "./data:/data"
      # Для списка проектов из файла (если используете вариант с "@/extras/..."):
      # - "./extras:/extras"
