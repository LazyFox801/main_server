services:
  mc:
    image: itzg/minecraft-server:java21
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      MEMORY: "10240M"
      MAX_PLAYERS: "10"
      MOTD: "Добро пожаловать!"
      ICON: "https://i.ibb.co/wFZwVNYf/asfdbbzijtk6eclbhlrn-1.png"
      OVERRIDE_ICON: "true"
      ONLINE_MODE: "false"
      USE_AIKAR_FLAGS: "true"
      TZ: "Europe/Moscow"
      DIFFICULTY: "normal"
      SERVER_NAME: "Lazyfox Server"
      OPS: |-
        lazyfox80

      FETCH_RESPONSE_TIMEOUT: "PT90S"
      DEBUG: "true"

      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_ALLOWED_VERSION_TYPE: "release"
      REMOVE_OLD_MODS: "TRUE"

      MODRINTH_PROJECTS: |-
        fabric-api:0.116.6+1.21.1
        azurelib:3.0.32
        smartbrainlib:1.16.10
        vics-point-blank:1.9.6
        emi:1.1.22+1.21.1+fabric
        common-network:1.0.18-1.21.1
        geckolib:4.8.2

      FUNCTION_PERMISSION_LEVEL: "4"
    volumes:
      - "./data:/data"
      - "./mods:/mods:ro"
